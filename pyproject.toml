[project]
name = "no-bs-rl-summative"
version = "0.1.0"
description = "Mission-based RL summative: adaptive redaction-policy agent for the No BS bias-screening tool"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "stable-baselines3[extra]>=2.3",
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]
